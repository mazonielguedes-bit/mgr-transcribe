plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mgr.transcribe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mgr.transcribe'
        minSdk 29
        targetSdk 35
        versionCode 10
        versionName '1.0.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
